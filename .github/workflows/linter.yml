name: "Linter"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  bash:
    name: Calling bask workflow
    uses: ./.github/workflows/bash.yml
  lint:
    runs-on: ubuntu-latest
    # needs:
    #   - bash
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Super linter
        uses: super-linter/super-linter@v7.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_JAVASCRIPT_ES: true
          DEFAULT_BRANCH: main
      #   # now call reusable workflow job has one of the steps for the linter
      - name: Calling the bash job has the one step of the linter
        uses: bash
      



