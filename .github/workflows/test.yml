name: 'Auth Lint on Push'

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Test Linux server
        run: |
          touch index.txt
          echo "Hello world" >> index.txt
          cat index.txt
          echo "$GITHUB_TOKEN"
          ls
      - name: Custom lint
        run: |
          npm install
          npm run check
          npm run run
